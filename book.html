<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>作品档案 · 纵横风向标</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23faf9f6'/%3E%3Ctext x='12' y='17' font-family='serif' font-size='15' text-anchor='middle' fill='%231c1a16'%3E档%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=4">
  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="js/icons.js?v=4"></script>
</head>
<body>
<div id="app">
  <main class="main">
    <header class="main-header">
      <div class="header-title">
        <div class="eyebrow">Book Profile · 作品档案</div>
        <h1 v-if="book">《{{ book.title }}》</h1>
        <h1 v-else>作品档案</h1>
      </div>
      <div class="header-actions">
        <a class="link-btn" href="index.html">返回看板</a>
        <a class="link-btn" href="trend.html">风向趋势</a>
      </div>
    </header>

    <div class="content">
      <div class="state-box" v-if="loading">
        <div class="spinner"></div>
        <span class="eyebrow">Searching</span>
        正在全站检索这部作品…
      </div>

      <div class="state-box" v-else-if="!book">
        <span class="eyebrow">Not Found</span>
        没有找到该作品的上榜记录（可能已掉榜）
        <div style="margin-top:16px"><a class="btn-line" href="index.html">返回看板</a></div>
      </div>

      <template v-if="book">
        <section class="detail-hero">
          <img v-if="book.cover" class="detail-cover" :class="{ 'is-square': isAuthorCover }"
               :src="book.cover" :alt="book.title">
          <div class="detail-main">
            <div class="detail-title">《{{ book.title }}》</div>
            <div class="detail-meta">
              <span>{{ book.author }}</span>
              <span class="sep">/</span>
              <span v-if="book.category">{{ book.category }}</span>
              <span class="sep">/</span>
              <span>{{ book.serialStatus === 1 ? '已完结' : '连载中' }}</span>
            </div>
            <p class="detail-intro">{{ book.intro || '暂无简介' }}</p>
            <div class="detail-actions">
              <a class="btn-ink" :href="book.url" target="_blank" rel="noopener">
                在纵横打开原著
                <zh-icon name="external" :size="13"></zh-icon>
              </a>
              <span class="btn-line" v-if="book.latestChapter" style="cursor:default">
                {{ book.latestChapter }}（{{ book.latestChapterTime }}）
              </span>
            </div>
          </div>
        </section>

        <div class="section-head">
          <h2 class="section-title">跨榜表现</h2>
          <span class="section-sub">在全站各榜单的上榜位置</span>
        </div>
        <div class="note-list">
          <div v-for="(r, i) in appearances" :key="r.board" class="note-row" :style="{ '--i': i }" style="cursor:default">
            <div class="note-no">No.{{ r.rank }}</div>
            <div class="note-main">
              <span class="note-title">{{ r.boardName }}</span>
              <div class="note-sub">{{ r.category }}<template v-if="r.updatedToday"> · 今日更新：{{ r.latestChapter }}</template></div>
            </div>
            <div class="note-meta"><span class="strong">{{ fmtNum(r.metric) }}</span>{{ r.metricLabel }}</div>
          </div>
          <div v-if="!appearances.length" class="section-sub" style="padding:12px 2px">该作品当前仅在一个榜单出现</div>
        </div>

        <footer class="footer">
          数据仅用于分析学习 · 作品版权归原作者与纵横中文网所有
        </footer>
      </template>
    </div>
  </main>
</div>

<script src="js/book.js?v=4"></script>
</body>
</html>
