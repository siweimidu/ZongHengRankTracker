<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>风向趋势 · 纵横风向标</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23faf9f6'/%3E%3Ctext x='12' y='17' font-family='serif' font-size='15' text-anchor='middle' fill='%231c1a16'%3E势%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=4">
  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="js/icons.js?v=4"></script>
</head>
<body>
<div id="app">
  <main class="main">
    <header class="main-header">
      <div class="header-title">
        <div class="eyebrow">Trend Review · 风向趋势</div>
        <h1>题材风向与数据洞察</h1>
      </div>
      <div class="header-actions">
        <div class="text-seg" style="flex-wrap:wrap;max-width:420px">
          <button v-for="b in boards" :key="b.slug"
                  :class="{ 'is-active': b.slug === activeBoard }"
                  @click="switchBoard(b.slug)">{{ b.name }}</button>
        </div>
        <a class="link-btn" href="index.html">返回看板</a>
        <a class="link-btn" href="https://github.com/siweimidu/ZongHengRankTracker" target="_blank" rel="noopener">
          <zh-icon name="github" :size="13"></zh-icon>
        </a>
      </div>
    </header>

    <div class="content">
      <div class="state-box" v-if="loading">
        <div class="spinner"></div>
        <span class="eyebrow">Loading</span>
        正在核算本期数据…
      </div>

      <template v-if="!loading && analysis">
        <!-- 黑马 -->
        <template v-if="darkhorses.length">
          <div class="section-head">
            <h2 class="section-title">本期黑马</h2>
            <span class="section-sub">{{ boardName }} · {{ date }}</span>
          </div>
          <div class="note-list" style="margin-bottom:34px">
            <div v-for="(d, i) in darkhorses" :key="d.bookId" class="note-row" :style="{ '--i': i }">
              <div class="note-no">No.{{ d.rank }}</div>
              <div class="note-main">
                <span class="note-title">《{{ d.title }}》</span>
                <div class="note-sub">{{ d.author }} — {{ d.reason }}</div>
              </div>
              <div class="note-meta">{{ boardName }}</div>
            </div>
          </div>
        </template>

        <!-- 图表 -->
        <div class="section-head">
          <h2 class="section-title">数据洞察</h2>
          <span class="section-sub">{{ boardName }}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="chart-card">
            <div class="chart-title">分类热度指数</div>
            <div class="chart-sub">Top10 数量与头部指标加权，衡量各分类声量</div>
            <div id="chart-cate" style="width:100%;height:330px"></div>
          </div>
          <div class="chart-grid-2">
            <div class="chart-card">
              <div class="chart-title">高频题材关键词</div>
              <div class="chart-sub">基于上榜作品书名与简介统计</div>
              <div id="chart-kw" style="width:100%;height:290px"></div>
            </div>
            <div class="chart-card">
              <div class="chart-title">榜首时间轴</div>
              <div class="chart-sub">历史每日榜首（数据累积后更有洞察）</div>
              <div id="chart-timeline" style="width:100%;height:290px"></div>
            </div>
          </div>
        </div>

        <!-- 关键词 -->
        <div class="section-head">
          <h2 class="section-title">题材速览</h2>
          <span class="section-sub">点击复制关键词</span>
        </div>
        <div class="kw-cloud">
          <span v-for="(k, i) in keywordHeat" :key="k.keyword" class="kw-item" :style="{ '--i': i }"
                @click="copyKw(k.keyword)">
            <span>{{ k.keyword }}</span><span class="c">{{ k.count }}</span>
          </span>
          <span v-if="!keywordHeat.length" class="section-sub">暂无数据</span>
        </div>

        <footer class="footer">
          数据来源 <a href="https://www.zongheng.com/rank" target="_blank" rel="noopener">纵横中文网排行榜</a>
          · 趋势基于每日快照自动计算 · <a href="index.html">返回看板</a>
        </footer>
      </template>

      <div class="state-box" v-if="!loading && !analysis">
        <span class="eyebrow">Empty</span>
        该榜单暂无趋势数据
      </div>
    </div>
  </main>
</div>

<script src="js/trend.js?v=4"></script>
</body>
</html>
