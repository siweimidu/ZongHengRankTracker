<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>风向趋势 · 纵横风向标</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230065fd'/%3E%3Cpath d='M6 15l4-4 3 3 5-6' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=2">
  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="js/icons.js?v=2"></script>
</head>
<body>
<div id="app">
  <main class="main">
    <header class="main-header">
      <div class="header-title">
        <h1>风向趋势 <span style="color:var(--muted-foreground);font-weight:500;font-size:14px">TREND</span></h1>
        <div class="board-desc">题材热度 · 分类声量 · 榜首时间轴</div>
      </div>
      <div class="header-actions">
        <div class="preset-seg" style="flex-wrap:wrap">
          <button v-for="b in boards" :key="b.slug" class="preset-btn"
                  :class="{ 'is-active': b.slug === activeBoard }"
                  @click="switchBoard(b.slug)">{{ b.name }}</button>
        </div>
        <a class="icon-btn" href="index.html">
          <zh-icon name="home" :size="13"></zh-icon> 返回看板
        </a>
        <a class="icon-btn" href="https://github.com/siweimidu/ZongHengRankTracker" target="_blank" rel="noopener">
          <zh-icon name="github" :size="13"></zh-icon>
        </a>
      </div>
    </header>

    <div class="content">
      <div class="state-box" v-if="loading">
        <div class="spinner"></div> 正在拉取趋势数据…
      </div>

      <template v-if="!loading && analysis">
        <!-- 黑马 -->
        <section v-if="darkhorses.length">
          <div class="section-head">
            <h2 class="section-title"><zh-icon name="bolt" :size="16"></zh-icon> 本榜黑马信号</h2>
            <span class="section-sub">{{ date }}</span>
          </div>
          <div class="dark-grid" style="margin-bottom:26px">
            <div v-for="(d, i) in darkhorses" :key="d.bookId" class="dark-card" :style="{ '--i': i }">
              <div class="dark-rank">#{{ d.rank }}</div>
              <div>
                <div class="dark-title">{{ d.title }}</div>
                <div class="dark-sub">{{ d.author }}</div>
                <span class="dark-reason"><zh-icon name="bolt" :size="10"></zh-icon> {{ d.reason }}</span>
              </div>
            </div>
          </div>
        </section>

        <!-- 图表 -->
        <section>
          <div class="section-head">
            <h2 class="section-title"><zh-icon name="fire" :size="16"></zh-icon> 数据洞察</h2>
            <span class="section-sub">{{ boardName }}</span>
          </div>
          <div style="display:grid;grid-template-columns:1fr;gap:14px">
            <div class="chart-card">
              <div class="chart-title"><zh-icon name="grid" :size="14"></zh-icon> 分类热度指数</div>
              <div class="chart-sub">Top10 数量 + 头部指标对数加权，反映各分类声量</div>
              <div id="chart-cate" style="width:100%;height:330px"></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px" class="chart-grid-2">
              <div class="chart-card">
                <div class="chart-title"><zh-icon name="star" :size="14"></zh-icon> 高频题材关键词</div>
                <div class="chart-sub">基于上榜作品书名与简介命中统计</div>
                <div id="chart-kw" style="width:100%;height:300px"></div>
              </div>
              <div class="chart-card">
                <div class="chart-title"><zh-icon name="trend" :size="14"></zh-icon> 榜首时间轴</div>
                <div class="chart-sub">历史每日榜首（数据累积后更有洞察）</div>
                <div id="chart-timeline" style="width:100%;height:300px"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- 关键词云 -->
        <section style="margin-top:26px">
          <div class="section-head">
            <h2 class="section-title"><zh-icon name="chip" :size="16"></zh-icon> 题材热度速览</h2>
            <span class="section-sub">点击可复制关键词</span>
          </div>
          <div class="kw-cloud">
            <span v-for="(k, i) in keywordHeat" :key="k.keyword" class="kw-pill" :style="{ '--i': i }"
                  @click="copyKw(k.keyword)">
              <zh-icon name="fire" :size="12"></zh-icon>
              <span class="k">{{ k.keyword }}</span>
              <span class="c">{{ k.count }} 本</span>
            </span>
            <span v-if="!keywordHeat.length" class="section-sub">暂无数据</span>
          </div>
        </section>
      </template>

      <div class="state-box" v-if="!loading && !analysis">
        <p>该榜单暂无趋势数据</p>
      </div>

      <footer class="footer">
        数据来源 <a href="https://www.zongheng.com/rank" target="_blank" rel="noopener">纵横中文网排行榜</a>
        · 趋势基于每日快照自动计算 · <a href="index.html">返回看板</a>
      </footer>
    </div>
  </main>
</div>

<script src="js/trend.js?v=2"></script>
</body>
</html>
