<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>纵横风向标 · 纵横中文网排行榜每日评论</title>
  <meta name="description" content="追踪纵横中文网全部排行榜，每日自动抓取 Top 30 并结合 AI 生成趋势分析">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23faf9f6'/%3E%3Ctext x='12' y='17' font-family='serif' font-size='15' text-anchor='middle' fill='%231c1a16'%3E纵%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=3">
  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="js/icons.js?v=3"></script>
</head>
<body>
<div id="app">
  <div class="app">
    <!-- ===== 侧边栏 ===== -->
    <aside class="sidebar" :class="{ open: sidebarOpen }">
      <div class="brand">
        <div class="brand-name">纵横风向标</div>
        <div class="brand-en">Zongheng Rank Review, daily.</div>
      </div>
      <div class="update-date">
        <span class="dot-live"></span>
        {{ boardsDate || '——' }} 刊 · 每日 04:07 出版
      </div>

      <div class="nav-block">
        <span class="eyebrow">Boards · 榜单</span>
        <nav class="board-nav">
          <a v-for="b in boards" :key="b.slug" :href="boardHref(b)"
             :class="{ 'is-active': b.slug === activeBoard }">{{ b.name }}</a>
        </nav>
      </div>

      <div class="nav-block" v-if="categories.length > 1">
        <span class="eyebrow">Categories · 分类</span>
        <nav class="cat-nav">
          <button v-for="c in categories" :key="c.name"
                  :class="{ 'is-active': c.name === activeCat }"
                  @click="setCat(c.name)">
            <span>{{ c.name }}</span><span class="cnt">{{ c.books.length }}</span>
          </button>
        </nav>
      </div>

      <div class="sidebar-foot">
        <a class="side-link" href="trend.html"><zh-icon name="trend" :size="14"></zh-icon> 风向趋势</a>
        <a class="side-link" href="https://github.com/siweimidu/ZongHengRankTracker" target="_blank" rel="noopener"><zh-icon name="github" :size="14"></zh-icon> GitHub</a>
      </div>
    </aside>
    <div class="sidebar-overlay" :class="{ show: sidebarOpen }" @click="sidebarOpen = false"></div>

    <!-- ===== 主内容 ===== -->
    <main class="main">
      <header class="main-header">
        <button class="menu-btn" @click="sidebarOpen = true" aria-label="打开菜单">
          <zh-icon name="menu" :size="16"></zh-icon>
        </button>
        <div class="header-title">
          <div class="eyebrow">{{ activeBoardEn }}</div>
          <h1>{{ activeBoardName }}<span class="cat-inline" v-if="activeCat">{{ activeCat }}</span></h1>
        </div>
        <div class="header-actions">
          <div class="date-bar">
            <div class="text-seg">
              <button :class="{ 'is-active': viewDate === '' }" @click="setViewDate('')">最新</button>
              <button :class="{ 'is-active': viewDate === yesterday }" @click="setViewDate(yesterday)" :disabled="!hasYesterday">昨日</button>
            </div>
            <button class="date-nav-btn" @click="stepDate(-1)" :disabled="!canPrev" aria-label="前一天">
              <zh-icon name="chevronLeft" :size="13"></zh-icon>
            </button>
            <button class="date-btn" :class="{ 'is-history': viewDate !== '' }">
              <span>{{ viewDate === '' ? boardsDate : viewDate }}</span>
              <input type="date" class="date-input-hidden" v-model="datePick" :min="minDate" :max="maxDate">
            </button>
            <button class="date-nav-btn" @click="stepDate(1)" :disabled="!canNext" aria-label="后一天">
              <zh-icon name="chevronRight" :size="13"></zh-icon>
            </button>
          </div>
          <div class="text-seg">
            <button :class="{ 'is-active': sortBy === 'rank' }" @click="sortBy = 'rank'">名次</button>
            <button :class="{ 'is-active': sortBy === 'metric' }" @click="sortBy = 'metric'">热度</button>
            <button :class="{ 'is-active': view === 'list' }" @click="view = 'list'">目录</button>
            <button :class="{ 'is-active': view === 'grid' }" @click="view = 'grid'">卡片</button>
          </div>
        </div>
      </header>

      <div class="content">
        <div class="state-box" v-if="loading">
          <div class="spinner"></div>
          <span class="eyebrow">Loading</span>
          正在整理本期榜单…
        </div>

        <template v-if="!loading">
          <!-- 数据栏 -->
          <div class="stat-strip">
            <div class="stat-cell">
              <div class="eyebrow">覆盖作品 Works</div>
              <div class="stat-num">{{ stats.books }}<span class="unit">本</span></div>
            </div>
            <div class="stat-cell">
              <div class="eyebrow">{{ stats.newHint }}</div>
              <div class="stat-num">{{ stats.newBooks }}</div>
            </div>
            <div class="stat-cell">
              <div class="eyebrow">当日更新率 Updated</div>
              <div class="stat-num">{{ stats.updateRate }}<span class="unit">%</span></div>
            </div>
            <div class="stat-cell">
              <div class="eyebrow">全站追踪 Boards</div>
              <div class="stat-num">{{ stats.boards }}<span class="unit">个</span></div>
            </div>
          </div>

          <!-- 编辑部按语 -->
          <div class="brief-block" v-if="brief && viewDate === ''">
            <div class="brief-head">
              <span class="eyebrow">Market Brief · 风向按语</span>
              <span class="date-tag">{{ briefDate }}</span>
            </div>
            <p class="brief-text">{{ briefTyped }}<span class="cursor" v-if="briefTyping"></span></p>
          </div>

          <!-- 分类按语 -->
          <div class="cat-note" v-if="catTrend && catTrend.summary">
            <div><strong>{{ activeBoardName }} · {{ activeCat }}</strong> —— {{ catTrend.summary }}</div>
            <div v-if="catTrend.first_day" style="margin-top:3px">首日基线采集中，明日起展示对比信号</div>
            <div v-else style="margin-top:3px">新上榜 {{ catTrend.new_count }} · 掉榜 {{ catTrend.dropped_count }} · 当日更新率 {{ Math.round((catTrend.update_rate || 0) * 100) }}%</div>
          </div>

          <!-- 目录式榜单 -->
          <div class="rank-list" v-if="view === 'list'">
            <div v-for="(b, i) in filteredBooks" :key="b.bookId + '-' + i"
                 class="rank-row" :style="{ '--i': Math.min(i, 16) }" @click="goBook(b.bookId)">
              <div class="rank-no">{{ String(b.rank).padStart(2, '0') }}</div>
              <img v-if="b.cover" class="rank-cover" :class="{ 'is-square': isAuthorBoard }" :src="b.cover" :alt="b.title" loading="lazy">
              <div class="rank-main">
                <div class="rank-title">
                  {{ b.title }}
                  <span v-if="isNew(b)" class="flag-new">NEW</span>
                </div>
                <div class="rank-meta">
                  <span>{{ b.author }}</span>
                  <span class="tag" v-if="b.category">{{ b.category }}</span>
                  <span class="tag done" v-if="b.serialStatus === 1">完结</span>
                  <span class="upd" v-if="b.updatedToday">今日更新</span>
                </div>
              </div>
              <div class="rank-leader"></div>
              <div class="rank-delta">
                <span v-if="rankChangeOf(b) > 0" class="delta-up">▲ {{ rankChangeOf(b) }}</span>
                <span v-else-if="rankChangeOf(b) < 0" class="delta-down">▼ {{ -rankChangeOf(b) }}</span>
                <span v-else-if="isNew(b)" class="delta-new">NEW</span>
              </div>
              <div class="rank-metric">
                <div class="v">{{ fmtNum(b.metric) }}</div>
                <div class="l">{{ b.metricLabel }}</div>
              </div>
            </div>
          </div>

          <!-- 卡片视图 -->
          <div class="card-grid" v-if="view === 'grid' && filteredBooks.length">
            <article v-for="(b, i) in filteredBooks" :key="b.bookId + '-' + i"
                     class="book-card" :style="{ '--i': Math.min(i, 16) }" @click="goBook(b.bookId)">
              <div class="card-cover-wrap" :class="{ 'is-square': isAuthorBoard }">
                <span class="card-no">{{ String(b.rank).padStart(2, '0') }}</span>
                <img v-if="b.cover" :src="b.cover" :alt="b.title" loading="lazy">
              </div>
              <div class="card-body">
                <div class="card-title">{{ b.title }}</div>
                <div class="card-meta">{{ b.author }}<template v-if="b.category"> · {{ b.category }}</template></div>
                <p class="card-intro">{{ b.intro || '暂无简介' }}</p>
                <div class="card-foot">
                  <div class="card-metric">
                    <span class="v">{{ fmtNum(b.metric) }}</span><span class="l">{{ b.metricLabel }}</span>
                  </div>
                  <div class="card-flags">
                    <span v-if="b.updatedToday" class="f-upd">更新</span>
                    <span v-if="isNew(b)" class="f-new">NEW</span>
                    <span v-if="rankChangeOf(b) > 0" class="f-up">▲{{ rankChangeOf(b) }}</span>
                    <span v-else-if="rankChangeOf(b) < 0" class="f-down">▼{{ -rankChangeOf(b) }}</span>
                  </div>
                </div>
              </div>
            </article>
          </div>

          <div class="state-box" v-if="!filteredBooks.length">
            <span class="eyebrow">Empty</span>
            该日期暂无快照数据
          </div>

          <!-- 黑马 -->
          <div class="section-head" v-if="darkhorses.length && viewDate === ''">
            <h2 class="section-title">本期黑马</h2>
            <span class="section-sub">新上榜即进前列，或单日名次暴涨</span>
          </div>
          <div class="note-list" v-if="darkhorses.length && viewDate === ''">
            <div v-for="(d, i) in darkhorses" :key="d.bookId" class="note-row" :style="{ '--i': i }" @click="goBook(d.bookId)">
              <div class="note-no">No.{{ d.rank }}</div>
              <div class="note-main">
                <span class="note-title">《{{ d.title }}》</span>
                <div class="note-sub">{{ d.author }} — {{ d.reason }}</div>
              </div>
              <div class="note-meta">{{ activeBoardName }}</div>
            </div>
          </div>

          <!-- 跨榜 -->
          <div class="section-head" v-if="crossTop.length && viewDate === ''">
            <h2 class="section-title">跨榜纵览</h2>
            <span class="section-sub">多榜同时上榜的全能作品，按影响力分排序</span>
          </div>
          <div class="note-list" v-if="crossTop.length && viewDate === ''">
            <div v-for="(c, i) in crossTop" :key="c.bookId" class="note-row" :style="{ '--i': i }" @click="goBook(c.bookId)">
              <div class="note-no">{{ i + 1 }}</div>
              <div class="note-main">
                <span class="note-title">《{{ c.title }}》</span>
                <div class="note-sub">{{ c.author }} · {{ c.boards.map(bd => bd.name + ' #' + bd.rank).join(' / ') }}</div>
              </div>
              <div class="note-meta"><span class="strong">{{ c.score }}</span>影响力分</div>
            </div>
          </div>

          <footer class="footer">
            数据来源 <a href="https://www.zongheng.com/rank" target="_blank" rel="noopener">纵横中文网排行榜</a> · 每日自动抓取并由 AI 生成趋势分析 ·
            <a href="https://github.com/siweimidu/ZongHengRankTracker" target="_blank" rel="noopener">ZongHengRankTracker</a>
            <br>本项目仅用于数据分析学习，作品版权归原作者与平台所有
          </footer>
        </template>
      </div>
    </main>
  </div>
</div>

<script src="js/app.js?v=3"></script>
</body>
</html>
